<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5a3a"/>
      <stop offset="0.5" stop-color="#5b8c5a"/>
      <stop offset="1" stop-color="#8bb88a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#forest)"/>

  <text x="600" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="32" fill="#fff" opacity="0.7">Placeholder Painting #2</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#fff" opacity="0.55">Pikachu is hiding somewhere&hellip;</text>

  <!-- Sun beams through trees (decoy yellow) -->
  <circle cx="1000" cy="160" r="48" fill="#ffe066" opacity="0.9"/>
  <line x1="1000" y1="160" x2="900" y2="280" stroke="#ffe066" stroke-width="40" opacity="0.18"/>
  <line x1="1000" y1="160" x2="800" y2="340" stroke="#ffe066" stroke-width="32" opacity="0.18"/>

  <!-- Tree trunks -->
  <rect x="500" y="280" width="40" height="450" fill="#5a3a20"/>
  <rect x="700" y="240" width="50" height="490" fill="#4a2e18"/>
  <rect x="900" y="320" width="36" height="410" fill="#5a3a20"/>

  <!-- Tree canopies -->
  <ellipse cx="520" cy="300" rx="120" ry="80" fill="#2e4d2e"/>
  <ellipse cx="725" cy="260" rx="140" ry="100" fill="#3a5e3a"/>
  <ellipse cx="918" cy="340" rx="110" ry="75" fill="#2e4d2e"/>

  <!-- Ground texture -->
  <path d="M 0 700 Q 300 680 600 700 T 1200 700 L 1200 800 L 0 800 Z" fill="#4a3a20" opacity="0.85"/>

  <!-- A yellow mushroom (decoy yellow) -->
  <g transform="translate(820, 690)">
    <rect x="-5" y="0" width="10" height="20" fill="#f4d8a8"/>
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#ffd54a"/>
    <circle cx="-6" cy="-2" r="2.5" fill="#fff"/>
    <circle cx="5" cy="-3" r="2" fill="#fff"/>
  </g>

  <!-- Another yellow detail: small lantern -->
  <g transform="translate(620, 420)">
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#222" stroke-width="1.5"/>
    <rect x="-10" y="0" width="20" height="22" fill="#ffd54a" stroke="#a8740a" stroke-width="1"/>
    <rect x="-6" y="4" width="12" height="14" fill="#fff4b8"/>
  </g>

  <!-- Pikachu hiding spot: box (200, 180) - (360, 340) -->
  <g transform="translate(200, 180)">
    <!-- Head/body blob -->
    <ellipse cx="80" cy="95" rx="58" ry="55" fill="#ffd54a" stroke="#a8740a" stroke-width="1.5"/>
    <!-- Ears -->
    <path d="M 38 55 L 22 8 L 60 38 Z" fill="#ffd54a" stroke="#222" stroke-width="2"/>
    <path d="M 122 55 L 138 8 L 100 38 Z" fill="#ffd54a" stroke="#222" stroke-width="2"/>
    <!-- Black ear tips -->
    <path d="M 22 8 L 32 22 L 26 2 Z" fill="#222"/>
    <path d="M 138 8 L 128 22 L 134 2 Z" fill="#222"/>
    <!-- Cheeks -->
    <circle cx="40" cy="110" r="12" fill="#ff5252"/>
    <circle cx="120" cy="110" r="12" fill="#ff5252"/>
    <!-- Eyes -->
    <circle cx="60" cy="85" r="9" fill="#222"/>
    <circle cx="100" cy="85" r="9" fill="#222"/>
    <circle cx="62" cy="82" r="3" fill="#fff"/>
    <circle cx="102" cy="82" r="3" fill="#fff"/>
    <!-- Nose and mouth -->
    <ellipse cx="80" cy="100" rx="3" ry="2" fill="#222"/>
    <path d="M 72 108 Q 80 118 88 108" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
