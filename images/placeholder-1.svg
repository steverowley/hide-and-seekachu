<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb6e0"/>
      <stop offset="0.7" stop-color="#cfe5f4"/>
      <stop offset="1" stop-color="#ffe8a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>

  <text x="600" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="32" fill="#1a3a5f" opacity="0.6">Placeholder Painting #1</text>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a3a5f" opacity="0.5">Pikachu is hiding somewhere&hellip;</text>

  <!-- Sun (decoy yellow) -->
  <circle cx="220" cy="180" r="55" fill="#ffe066" opacity="0.85"/>
  <circle cx="220" cy="180" r="42" fill="#fff4b8"/>

  <!-- Clouds -->
  <ellipse cx="430" cy="170" rx="90" ry="28" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="470" cy="150" rx="60" ry="22" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="780" cy="220" rx="110" ry="32" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="830" cy="200" rx="70" ry="25" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="950" cy="380" rx="80" ry="26" fill="#ffffff" opacity="0.75"/>

  <!-- Distant hills -->
  <path d="M 0 620 Q 200 540 400 600 T 800 580 T 1200 600 L 1200 800 L 0 800 Z" fill="#9bbf8a" opacity="0.7"/>
  <path d="M 0 680 Q 250 620 500 670 T 1000 660 T 1200 680 L 1200 800 L 0 800 Z" fill="#7ea876"/>

  <!-- A small bird (decoy detail) -->
  <path d="M 500 300 q 10 -10 20 0 q 10 -10 20 0" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 600 250 q 10 -10 20 0 q 10 -10 20 0" stroke="#333" stroke-width="2" fill="none"/>

  <!-- A yellow flower bunch in the field (more decoy yellow) -->
  <g transform="translate(380, 720)">
    <circle cx="0" cy="0" r="8" fill="#ffd54a"/>
    <circle cx="15" cy="-5" r="6" fill="#ffd54a"/>
    <circle cx="-12" cy="-3" r="6" fill="#ffd54a"/>
  </g>

  <!-- Pikachu hiding spot: box (820, 520) - (980, 680) -->
  <g transform="translate(820, 520)">
    <!-- Head/body blob -->
    <ellipse cx="80" cy="95" rx="58" ry="55" fill="#ffd54a" stroke="#a8740a" stroke-width="1.5"/>
    <!-- Ears -->
    <path d="M 38 55 L 22 8 L 60 38 Z" fill="#ffd54a" stroke="#222" stroke-width="2"/>
    <path d="M 122 55 L 138 8 L 100 38 Z" fill="#ffd54a" stroke="#222" stroke-width="2"/>
    <!-- Black ear tips -->
    <path d="M 22 8 L 32 22 L 26 2 Z" fill="#222"/>
    <path d="M 138 8 L 128 22 L 134 2 Z" fill="#222"/>
    <!-- Cheeks -->
    <circle cx="40" cy="110" r="12" fill="#ff5252"/>
    <circle cx="120" cy="110" r="12" fill="#ff5252"/>
    <!-- Eyes -->
    <circle cx="60" cy="85" r="9" fill="#222"/>
    <circle cx="100" cy="85" r="9" fill="#222"/>
    <circle cx="62" cy="82" r="3" fill="#fff"/>
    <circle cx="102" cy="82" r="3" fill="#fff"/>
    <!-- Nose and mouth -->
    <ellipse cx="80" cy="100" rx="3" ry="2" fill="#222"/>
    <path d="M 72 108 Q 80 118 88 108" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
